<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="50%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#181c28"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Geometric Apex Triangle / A-Logo -->
  <g transform="translate(0, 10)">
    <!-- Main Apex Prism Pillar -->
    <path d="M 256 96 L 384 352 L 320 352 L 256 224 L 192 352 L 128 352 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    
    <!-- Inner Cyan Apex Accent Line -->
    <path d="M 256 160 L 320 288 L 290 288 L 256 216 L 222 288 L 192 288 Z" fill="#06b6d4" opacity="0.9"/>
    
    <!-- Dynamic Upward Financial Trend Arrow / Bar -->
    <path d="M 140 384 L 200 324 L 250 354 L 370 234 L 380 280 L 396 208 L 324 220 L 340 236 L 250 324 L 200 294 L 140 354 Z" fill="url(#cyanGrad)"/>
    
    <!-- Base Foundation Vault Bar -->
    <rect x="128" y="380" width="256" height="24" rx="12" fill="#22d3ee" opacity="0.8"/>
  </g>
</svg>
